name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

defaults:
  run:
    working-directory: .

jobs:
  # Job 1: Validate Branch Name
  validate-branch-name:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check branch name format
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          echo "Checking branch: $BRANCH_NAME"

          # Pattern: type/LIN-XXX-description
          if [[ ! $BRANCH_NAME =~ ^(feature|bugfix|hotfix|docs|refactor|test)/LIN-[0-9]+-[a-z0-9-]+$ ]]; then
            echo "Invalid branch name: $BRANCH_NAME"
            echo "Branch must follow pattern: type/LIN-XXX-description"
            echo "Valid types: feature, bugfix, hotfix, docs, refactor, test"
            echo "Example: feature/LIN-123-add-scheduler"
            exit 1
          fi

          echo "Branch name is valid"

  # Job 2: Lint and Type Check
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript check
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

  # Job 3: Unit Tests
  unit-tests:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit -- --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  # Job 4: Integration Tests
  integration-tests:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: reditfast_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Setup database
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/reditfast_test
        run: |
          npx prisma migrate deploy
          npx prisma db seed

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/reditfast_test
          REDIS_URL: redis://localhost:6379
        run: npm run test:integration

  # Job 5: Security Scan
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --audit-level=moderate

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD
          extra_args: --debug --only-verified

      - name: Check for hardcoded secrets
        run: |
          # trufflehog covers most cases; this is a small extra guardrail for obvious key formats.
          MATCHES=$(grep -RInE \
            'sk_(live|test)_[0-9a-zA-Z]{16,}|pk_(live|test)_[0-9a-zA-Z]{16,}|whsec_[0-9a-zA-Z]{16,}|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{35}' \
            . \
            --exclude-dir=node_modules \
            --exclude-dir=.git \
            --exclude-dir=prisma/migrations \
            --include='*.ts' \
            --include='*.tsx' \
            --include='*.js' \
            --include='*.jsx' \
            || true)
          if [ -n "$MATCHES" ]; then
            echo "$MATCHES"
            echo "Potential hardcoded secrets found. Review matches above."
            exit 1
          fi

  # Job 6: Build Test
  build-test:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

  # Job 7: PR Validation
  pr-validation:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs:
      [
        validate-branch-name,
        lint-and-typecheck,
        unit-tests,
        integration-tests,
        security-scan,
      ]
    steps:
      - uses: actions/checkout@v4

      - name: Check PR title format
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          echo "PR Title: $PR_TITLE"

          # Pattern: RED-XX Description OR [RED-XX] Description (LIN-XXX is also allowed)
          if [[ ! $PR_TITLE =~ ^(\[RED-[0-9]+\]\ |RED-[0-9]+\ |\\[LIN-[0-9]+\\]\\ ).+ ]]; then
            echo "Invalid PR title format"
            echo "PR title must follow: RED-XX Description"
            echo "Example: RED-23 Add projects CRUD API"
            exit 1
          fi

          echo "PR title is valid"

      - name: Check PR description
        uses: actions/github-script@v7
        with:
          script: |
            const prBody = context.payload.pull_request.body || '';

            const requiredSections = [
              '## Linear Issue',
              '## Changes',
              '## Testing'
            ];

            const missing = requiredSections.filter(section => !prBody.includes(section));

            if (missing.length > 0) {
              core.setFailed(`PR description missing required sections: ${missing.join(', ')}`);
            }

            if (!prBody.match(/Closes (LIN|RED)-\d+|Relates to (LIN|RED)-\d+/)) {
              core.setFailed('PR description must include Linear issue reference (e.g., "Closes RED-23")');
            }

            console.log('PR description format is valid');

  # Job 8: E2E Tests (only on main/develop)
  e2e-tests:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    needs: [build-test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install

      - name: Run E2E tests
        run: npm run test:e2e

  # Job 9: Deploy to Staging (only on develop)
  deploy-staging:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    needs: [e2e-tests]
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel (Staging)
        run: |
          echo "Deploying to staging environment..."
          # Add actual deployment command here
          # Example: vercel --token=${{ secrets.VERCEL_TOKEN }} --scope=${{ secrets.VERCEL_SCOPE }}

      - name: Run smoke tests
        run: |
          echo "Running smoke tests on staging..."
          # Add smoke test commands here

  # Job 10: Deploy to Production (only on main, manual approval required)
  deploy-production:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [e2e-tests]
    environment: production # This requires manual approval
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel (Production)
        run: |
          echo "Deploying to production environment..."
          # Add actual deployment command here

      - name: Run smoke tests
        run: |
          echo "Running smoke tests on production..."
          # Add smoke test commands here

      - name: Notify team
        run: |
          echo "Production deployment complete!"
          # Add Slack/Discord notification here
